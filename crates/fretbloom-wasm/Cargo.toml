[package]
name = "fretbloom-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fretbloom-analysis = { path = "../fretbloom-analysis", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
wasm-bindgen = "=0.2.100"
