[package]
name = "fretbloom-analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
rustfft = "6.4.0"
clap = { version = "4.5.45", features = ["derive"], optional = true }
ctrlc = { version = "3.4.7", optional = true }

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ctrlc"]

[[bin]]
name = "analyze-pcm"
required-features = ["cli"]

# Already locked by the workspace backend; used only for opt-in fixture verification.
[dev-dependencies]
sha2 = "=0.10.9"
